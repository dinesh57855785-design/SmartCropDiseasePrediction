databases:
  - name: smartcrop-postgres
    databaseName: smartcrop
    user: smartcrop
    plan: free

services:
  - type: web
    name: smartcrop-api
    runtime: python
    plan:free
    buildCommand: cd backend && bash build.sh
    startCommand: cd backend && gunicorn config.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: smartcrop-postgres
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
